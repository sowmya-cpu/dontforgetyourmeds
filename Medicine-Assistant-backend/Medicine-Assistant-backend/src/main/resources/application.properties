spring.application.name=Medicine-Assistant-backend
spring.h2.console.settings.web-allow-others=true
spring.datasource.url=jdbc:h2:file:./data/medicineassistant
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


#gemini.api.key=${GEMINI_API_KEY}
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent
# Web Push configuration
webpush.public-key=${VAPID_PUBLIC_KEY}
webpush.private-key=${VAPID_PRIVATE_KEY}
webpush.subject=${VAPID_SUBJECT}
